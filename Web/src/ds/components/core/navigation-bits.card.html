<!-- @dsCard group="Components" viewport="700x300" name="Search, Tabs, Chips & Badges" subtitle="SearchBar, Tabs, Chip filters, status Badges, Rating" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { SearchBar, Tabs, Chip, Badge, Rating } = window.RezervameDesignSystem_4317c4;
    function Demo() {
      const [tab, setTab] = React.useState('servicios');
      const [chip, setChip] = React.useState('TODOS');
      return (
        <div className="stack">
          <SearchBar />
          <Tabs value={tab} onChange={setTab} items={[{label:'Servicios',value:'servicios'},{label:'Equipo',value:'equipo'},{label:'Portfolio',value:'portfolio'},{label:'Reseñas',value:'resenas'}]} />
          <div className="row">
            {['TODOS','MUJERES','HOMBRES','NIÑOS','PROMOCIONES'].map(c => (
              <Chip key={c} active={chip===c} onClick={()=>setChip(c)}>{c}</Chip>
            ))}
          </div>
          <div className="row">
            <Badge tone="success">Pagada</Badge>
            <Badge tone="warning">Pendiente</Badge>
            <Badge tone="error">Cancelada</Badge>
            <Badge tone="coral" uppercase={false}>Nuevo en la plataforma</Badge>
            <Badge tone="navy">Premium</Badge>
            <Rating value={4.9} count={287} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
