services:
  - type: web
    name: rezervame
    plan: free
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: WEB_APP_URL
        value: https://rezervame-web.web.app
      - key: ADMIN_APP_URL
        value: https://rezervame-admin.web.app
