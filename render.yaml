services:
  - type: web
    name: rezervame-backend
    plan: free
    runtime: node
    buildCommand: cd Backend && npm install --production=false && npx prisma generate && (npx prisma migrate deploy || npx prisma db push) && npm run build
    startCommand: cd Backend && node dist/src/main
    envVars:
      - key: DATABASE_URL
        sync: false # User will provide this in the Render dashboard
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
