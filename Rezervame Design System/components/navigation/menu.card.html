<body>

  <script type="text/babel">
    const { Menu, MenuItem, Button } = window.RezervameDesignSystem_4317c4;
    function Demo() {
      return (
        <div className="row">
          <Menu width={216} trigger={({ toggle }) => <Button variant="outline" size="sm" leftIcon="calendar" onClick={toggle}>Calendario</Button>}>
            {({ close }) => (<>

              <MenuItem icon="heart" onClick={close}>Favoritos</MenuItem>
              <MenuItem icon="logout" danger divider onClick={close}>Cerrar sesión</MenuItem>
            </>)}
          </Menu>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
