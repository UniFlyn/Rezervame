<!-- @dsCard group="Components" viewport="700x440" name="Sticky Booking Bar" subtitle="Booksy-style 'Reservar Ahora' — hidden at top, slides in on scroll" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--rz-gray-100); font-family: var(--font-sans); }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rz-gray-400); margin: 18px 0 8px; }
  .lbl:first-child { margin-top: 0; }
  .frame { border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-sm); background: #fff; }
  .pageTop { height: 90px; background: linear-gradient(180deg,#eef2f4,#fff); display:flex; align-items:center; padding:0 24px; color: var(--rz-gray-400); font-size:13px; }
  .mobile { width: 380px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { StickyBookingBar } = window.RezervameDesignSystem_4317c4;
    const salon = "https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=96&h=96&q=70";
    function Demo() {
      return (
        <div>
          <div className="lbl">Visible — desktop (after scroll down)</div>
          <div className="frame">
            <StickyBookingBar static visible name="Luxe Hair Studio" location="Avenida Balboa, Ciudad de Panamá" avatar={salon} />
          </div>

          <div className="lbl">Hidden — initial state (at top of page, bar retracted)</div>
          <div className="frame" style={{ position: 'relative', overflow: 'hidden' }}>
            <div style={{ position:'relative' }}>
              <StickyBookingBar static visible={false} name="Luxe Hair Studio" location="Avenida Balboa, Ciudad de Panamá" avatar={salon} />
              <div className="pageTop" style={{ position:'absolute', inset:0 }}>Contenido de la página · la barra está oculta</div>
            </div>
          </div>

          <div className="lbl">Mobile — compact (location hidden on narrow widths)</div>
          <div className="frame mobile">
            <StickyBookingBar static visible name="Luxe Hair Studio" location="Avenida Balboa, Ciudad de Panamá" avatar={salon} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
