<!-- @dsCard group="Components" viewport="700x560" name="Invoices" subtitle="Desktop table row + mobile card, status chips, action icons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--rz-gray-050); }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rz-gray-400); margin: 22px 0 12px; }
  .lbl:first-child { margin-top: 0; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .chips { display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { InvoiceTable, InvoiceCard, Badge } = window.RezervameDesignSystem_4317c4;
    function Demo() {
      const rows = [
        {id:'#RES-1234', date:'15 Abr, 2024', business:'The Grooming Room', amount:'45.00', status:'pending'},
        {id:'#RES-1122', date:'12 Mar, 2024', business:'Nail Society Soho', amount:'30.00', status:'paid'},
        {id:'#RES-0987', date:'10 Feb, 2024', business:'Spa Wellness Center', amount:'120.00', status:'cancelled'},
      ];
      return (
        <div>
          <div className="lbl">Status chips</div>
          <div className="chips">
            <Badge tone="success" size="sm">Pagada</Badge>
            <Badge tone="warning" size="sm">Pendiente</Badge>
            <Badge tone="error" size="sm">Cancelada</Badge>
          </div>
          <div className="lbl">Desktop — table rows</div>
          <InvoiceTable rows={rows} />
          <div className="lbl">Mobile — stacked cards</div>
          <div className="cards">
            <InvoiceCard invoice={rows[0]} />
            <InvoiceCard invoice={rows[1]} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
