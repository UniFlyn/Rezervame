<!-- @dsCard group="Components" viewport="700x680" name="Login / Sign-up Modal" subtitle="Auth modal — default, loading, error & disabled states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--rz-gray-100); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 22px; align-items: start; }
  .cell { position: relative; height: 620px; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow-sm); background: #c9d3d8; }
  .tag { position: absolute; top: 10px; left: 12px; z-index: 5; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #fff; background: rgba(2,30,44,0.62); padding: 4px 10px; border-radius: 999px; }
  /* Contain each modal's fixed scrim inside its preview cell */
  .cell > div[style*="position: fixed"],
  .cell > div { position: absolute !important; inset: 0 !important; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { LoginModal } = window.RezervameDesignSystem_4317c4;
    const logo = "../../assets/logos/rezervame-color.png";
    function Cell({ label, children }) {
      return <div className="cell"><span className="tag">{label}</span>{children}</div>;
    }
    function Demo() {
      return (
        <div className="grid">
          <Cell label="Default"><LoginModal open logoSrc={logo} /></Cell>
          <Cell label="Disabled · email vacío"><LoginModal open logoSrc={logo} /></Cell>
          <Cell label="Loading"><LoginModal open logoSrc={logo} loading /></Cell>
          <Cell label="Error · correo inválido"><LoginModal open logoSrc={logo} error="Ingresa un correo electrónico válido." /></Cell>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
