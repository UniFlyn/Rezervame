<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 20px; align-items: start; }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Input, Select, Checkbox, Radio, Switch } = window.RezervameDesignSystem_4317c4;
    function Demo() {
      const [c1, setC1] = React.useState(true);
      const [r, setR] = React.useState('a');
      const [sw, setSw] = React.useState(true);
      const [sel, setSel] = React.useState('mujer');
      return (
        <div className="grid">
          <Input label="Nombre del negocio" icon="search" placeholder="Servicio o nombre" />
          <Input label="Correo" icon="mail" placeholder="tu@correo.com" />
          <Input label="Con error" icon="lock" placeholder="••••••" error="La contraseña es muy corta" />
          <Select label="Categoría" value={sel} onChange={setSel} options={[{label:'Mujeres',value:'mujer'},{label:'Hombres',value:'hombre'},{label:'Niños',value:'ninos'}]} />
          <div>
            <div className="row">
              <Checkbox checked={c1} onChange={setC1} label="Guardar método" />
              <Radio checked={r==='a'} onChange={()=>setR('a')} label="Crédito" />
              <Radio checked={r==='b'} onChange={()=>setR('b')} label="Yappy" />
            </div>
            <div className="row"><Switch checked={sw} onChange={setSw} label="Recordatorios por SMS" /></div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
