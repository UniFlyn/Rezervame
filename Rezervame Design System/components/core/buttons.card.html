<!-- @dsCard group="Components" viewport="700x640" name="Buttons & Actions" subtitle="Booking CTAs fill solid red on hover/active — primary, outline, states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .grp { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--rz-gray-400); width: 100%; margin-bottom: 2px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { Button, IconButton } = window.RezervameDesignSystem_4317c4;
    function Demo() {
      return (
        <div>
          <div className="grp"><span className="lbl">Variants</span>
            <Button variant="primary" shape="pill">Buscar</Button>
            <Button variant="dark">Ir al inicio</Button>
            <Button variant="outline" uppercase>Rezervame</Button>
            <Button variant="soft">Promociones</Button>
            <span style={{fontSize:10,color:'var(--rz-gray-400)',maxWidth:120,lineHeight:1.3}}>soft = chips/filters/low-emphasis only</span>
            <Button variant="ghost" rightIcon="chevronRight">Ver más</Button>
          </div>
          <div className="grp"><span className="lbl">Sizes</span>
            <Button variant="primary" size="sm">Small</Button>
            <Button variant="primary" size="md">Medium</Button>
            <Button variant="primary" size="lg">Large</Button>
          </div>
          <div className="grp"><span className="lbl">With icon · loading · disabled</span>
            <Button variant="primary" leftIcon="calendar">Reservar ahora</Button>
            <Button variant="primary" loading>Procesando</Button>
            <Button variant="primary" disabled>No disponible</Button>
          </div>
          <div className="grp"><span className="lbl">Booking CTA — outline fills red on hover &amp; press (hover the first one)</span>
            <Button variant="outline" uppercase>Ver disponibilidad</Button>
            <span style={{fontSize:11,color:'var(--rz-gray-400)'}}>↑ live</span>
            <Button variant="outline" uppercase style={{background:'var(--rz-coral)',color:'#fff',borderColor:'var(--rz-coral)',boxShadow:'var(--shadow-coral)'}}>Hover</Button>
            <Button variant="outline" uppercase style={{background:'var(--rz-coral-700)',color:'#fff',borderColor:'var(--rz-coral-700)'}}>Pressed</Button>
            <Button variant="outline" uppercase disabled>Disabled</Button>
          </div>
          <div className="grp"><span className="lbl">Icon buttons — sizes (sm · md · lg)</span>
            <IconButton icon="bell" variant="ghost" round size="sm" label="sm" />
            <IconButton icon="bell" variant="ghost" round size="md" label="md" />
            <IconButton icon="bell" variant="ghost" round size="lg" label="lg" />
            <span style={{fontSize:10,color:'var(--rz-gray-400)',maxWidth:150,lineHeight:1.3}}>larger glyph, same hit area</span>
          </div>
          <div className="grp"><span className="lbl">Icon buttons — states</span>
            <IconButton icon="heart" variant="ghost" round label="default" />
            <IconButton icon="heart" variant="ghost" round selected label="selected" />
            <IconButton icon="heart" variant="ghost" round disabled label="disabled" />
            <IconButton icon="bell" variant="ghost" round badge label="dot badge" />
            <IconButton icon="bell" variant="ghost" round badgeCount={3} label="count badge" />
          </div>
          <div className="grp"><span className="lbl">Icon buttons — variants</span>
            <IconButton icon="heart" variant="outline" round label="outline" />
            <IconButton icon="download" variant="soft" label="soft" />
            <IconButton icon="send" variant="filled" round label="filled" />
            <IconButton icon="settings" variant="dark" round label="dark" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
