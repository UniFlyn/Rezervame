<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base unit" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: #fff; display: flex; gap: 14px; align-items: flex-end; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--rz-coral-100); border: 1px solid var(--rz-coral-300); border-radius: 4px; }
  .lbl { font-size: 11px; color: var(--rz-gray-500); font-variant-numeric: tabular-nums; }
  .nm { font-size: 11px; font-weight: 700; color: var(--rz-navy); }
</style>
</head>
<body>
  <div class="col"><div class="bar" style="width:4px;height:4px"></div><div class="nm">1</div><div class="lbl">4</div></div>
  <div class="col"><div class="bar" style="width:8px;height:8px"></div><div class="nm">2</div><div class="lbl">8</div></div>
  <div class="col"><div class="bar" style="width:12px;height:12px"></div><div class="nm">3</div><div class="lbl">12</div></div>
  <div class="col"><div class="bar" style="width:16px;height:16px"></div><div class="nm">4</div><div class="lbl">16</div></div>
  <div class="col"><div class="bar" style="width:24px;height:24px"></div><div class="nm">6</div><div class="lbl">24</div></div>
  <div class="col"><div class="bar" style="width:32px;height:32px"></div><div class="nm">7</div><div class="lbl">32</div></div>
  <div class="col"><div class="bar" style="width:48px;height:48px"></div><div class="nm">9</div><div class="lbl">48</div></div>
  <div class="col"><div class="bar" style="width:64px;height:64px"></div><div class="nm">10</div><div class="lbl">64</div></div>
  <div class="col"><div class="bar" style="width:96px;height:96px"></div><div class="nm">12</div><div class="lbl">96</div></div>
</body>
</html>
