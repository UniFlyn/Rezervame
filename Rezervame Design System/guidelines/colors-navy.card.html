<!-- @dsCard group="Colors" viewport="700x205" name="Brand — Prussian Blue" subtitle="#023047 official primary dark — headings, key text, hierarchy. Darker steps = surfaces only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 76px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 700; color: var(--rz-navy); }
  .hex { font-size: 11px; color: var(--rz-gray-500); font-variant-numeric: tabular-nums; }
  .use { font-size: 10px; color: var(--rz-gray-500); margin-top: 2px; line-height: 1.25; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--rz-navy-900)"></div><div class="meta"><div class="name">navy-900</div><div class="hex">#011D2C</div><div class="use">Very dark bg only</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-navy-800)"></div><div class="meta"><div class="name">navy-800</div><div class="hex">#022A3D</div><div class="use">Dark CTA hover</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-navy)"></div><div class="meta"><div class="name">navy ★</div><div class="hex">#023047</div><div class="use">Primary dark</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-navy-500)"></div><div class="meta"><div class="name">navy-500</div><div class="hex">#1F6885</div><div class="use">Muted / info</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-navy-100)"></div><div class="meta"><div class="name">navy-100</div><div class="hex">#E3EDF2</div><div class="use">Soft fill</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-navy-050)"></div><div class="meta"><div class="name">navy-050</div><div class="hex">#F1F6F8</div><div class="use">Faint wash</div></div></div>
  </div>
</body>
</html>
