<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals" subtitle="Warm-leaning gray ramp — surfaces, borders, text" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 70px; }
  .meta { padding: 7px 8px; }
  .name { font-size: 11px; font-weight: 700; color: var(--rz-navy); }
  .hex { font-size: 10px; color: var(--rz-gray-500); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--rz-white)"></div><div class="meta"><div class="name">white</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-050)"></div><div class="meta"><div class="name">050</div><div class="hex">#F7F8FA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-100)"></div><div class="meta"><div class="name">100</div><div class="hex">#F1F3F6</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-200)"></div><div class="meta"><div class="name">200</div><div class="hex">#E7EAEF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-300)"></div><div class="meta"><div class="name">300</div><div class="hex">#D7DBE2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-400)"></div><div class="meta"><div class="name">400</div><div class="hex">#B3B8C2</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-500)"></div><div class="meta"><div class="name">500</div><div class="hex">#878A93</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-700)"></div><div class="meta"><div class="name">700</div><div class="hex">#4A4F5B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-gray-900)"></div><div class="meta"><div class="name">900</div><div class="hex">#1C2230</div></div></div>
  </div>
</body>
</html>
