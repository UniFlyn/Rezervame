<!-- @dsCard group="Colors" viewport="700x205" name="Brand — Bittersweet / Rezervame Red" subtitle="#FF5757 official accent — CTAs, logo, links, active. Darker steps = states only" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  .row { display: flex; gap: 10px; }
  .sw { flex: 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--border-subtle); }
  .chip { height: 76px; }
  .meta { padding: 8px 10px; }
  .name { font-size: 12px; font-weight: 700; color: var(--rz-navy); }
  .hex { font-size: 11px; color: var(--rz-gray-500); font-variant-numeric: tabular-nums; }
  .use { font-size: 10px; color: var(--rz-gray-500); margin-top: 2px; line-height: 1.25; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--rz-coral-700)"></div><div class="meta"><div class="name">coral-700</div><div class="hex">#D83B3B</div><div class="use">Pressed</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-coral-600)"></div><div class="meta"><div class="name">coral-600</div><div class="hex">#F04646</div><div class="use">Hover</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-coral)"></div><div class="meta"><div class="name">coral ★</div><div class="hex">#FF5757</div><div class="use">Default accent</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-coral-300)"></div><div class="meta"><div class="name">coral-300</div><div class="hex">#FFA3A3</div><div class="use">Decorative</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-coral-100)"></div><div class="meta"><div class="name">coral-100</div><div class="hex">#FFE3E3</div><div class="use">Selected wash</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--rz-coral-050)"></div><div class="meta"><div class="name">coral-050</div><div class="hex">#FFF1F1</div><div class="use">Faint wash</div></div></div>
  </div>
</body>
</html>
