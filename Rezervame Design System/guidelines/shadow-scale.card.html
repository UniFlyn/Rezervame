<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation & Shadow" subtitle="Soft warm-neutral ambient shadows" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--rz-gray-050); display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 96px; height: 70px; background: #fff; border-radius: 14px; }
  .nm { font-size: 11px; font-weight: 700; color: var(--rz-navy); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-card)"></div><div class="nm">card</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-modal)"></div><div class="nm">modal</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-coral)"></div><div class="nm">coral glow</div></div>
</body>
</html>
