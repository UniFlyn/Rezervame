<!-- @dsCard group="Type" viewport="700x180" name="Family & Weights" subtitle="Poppins — Light 300 to Black 900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-sans); }
  .name { font-size: 13px; color: var(--rz-gray-400); margin-bottom: 14px; letter-spacing: 0.02em; }
  .name b { color: var(--rz-navy); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 10px 28px; }
  .w { display: flex; flex-direction: column; gap: 2px; }
  .glyph { font-size: 30px; color: var(--rz-navy); line-height: 1.1; }
  .lab { font-size: 11px; color: var(--rz-gray-500); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="name"><b>Poppins</b> &nbsp;·&nbsp; "Poppins", "Segoe UI", system-ui, sans-serif &nbsp;·&nbsp; self-hosted</div>
  <div class="row">
    <div class="w"><span class="glyph" style="font-weight:300">Aa</span><span class="lab">Light 300</span></div>
    <div class="w"><span class="glyph" style="font-weight:400">Aa</span><span class="lab">Regular 400</span></div>
    <div class="w"><span class="glyph" style="font-weight:500">Aa</span><span class="lab">Medium 500</span></div>
    <div class="w"><span class="glyph" style="font-weight:600">Aa</span><span class="lab">SemiBold 600</span></div>
    <div class="w"><span class="glyph" style="font-weight:700">Aa</span><span class="lab">Bold 700</span></div>
    <div class="w"><span class="glyph" style="font-weight:800">Aa</span><span class="lab">ExtraBold 800</span></div>
    <div class="w"><span class="glyph" style="font-weight:900">Aa</span><span class="lab">Black 900</span></div>
  </div>
</body>
</html>
