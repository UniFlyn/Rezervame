<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; }
  .tag { width: 86px; flex: none; font-size: 11px; color: var(--rz-gray-400); font-variant-numeric: tabular-nums; }
  .spec { font-family: var(--font-sans); font-weight: 700; color: var(--rz-navy); letter-spacing: -0.5px; line-height: 1.15; }
</style>
</head>
<body>
  <div class="line"><span class="tag">60 / 700</span><span class="spec" style="font-size:60px">Reserva sin filas</span></div>
  <div class="line"><span class="tag">32 / 700</span><span class="spec" style="font-size:32px">Nuestros Servicios</span></div>
  <div class="line"><span class="tag">20 / 600</span><span class="spec" style="font-size:20px;font-weight:600;letter-spacing:-0.25px">Corte de cabello para mujer</span></div>
  <div class="line"><span class="tag">18 / 700</span><span class="spec" style="font-size:18px;letter-spacing:-0.25px">Luxe Hair Studio</span></div>
</body>
</html>
