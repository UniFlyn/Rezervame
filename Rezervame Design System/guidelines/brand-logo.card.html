<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 0; background: #fff; display: grid; grid-template-columns: 1fr 1fr; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 28px; min-height: 160px; }
  .light { background: #fff; }
  .dark { background: var(--rz-coral); }
  .light2 { background: var(--rz-gray-050); border-left: 1px solid var(--border-subtle); }
  img { height: 38px; }
</style>
</head>
<body>
  <div class="cell light"><img src="../assets/logos/rezervame-color.png" alt="rezervame full color" /></div>
  <div class="cell dark"><img src="../assets/logos/rezervame-white.png" alt="rezervame white on coral" /></div>
</body>
</html>
